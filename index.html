<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLAMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EEFF;--ink:#2A0F4F;--muted:#6B5A8A;--card:#fff;--tile:#E9DBFF;--edge:#CDB6F5;--hot:#D81B6A;--glow:#FFC21A;--g1:#F57C00;--g2:#E8267A;--on-grad:#fff;--halo:rgba(255,120,40,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C0A38;--ink:#FFF1F7;--muted:#B9A5DB;--card:#2B1352;--tile:#3A1D6B;--edge:#5A3496;--hot:#FF4D94;--glow:#FFD84D;--g1:#FFD84D;--g2:#FF4D94;--on-grad:#2A0F4F;--halo:rgba(255,90,60,.4)}}
:root[data-theme="dark"]{--bg:#1C0A38;--ink:#FFF1F7;--muted:#B9A5DB;--card:#2B1352;--tile:#3A1D6B;--edge:#5A3496;--hot:#FF4D94;--glow:#FFD84D;--g1:#FFD84D;--g2:#FF4D94;--on-grad:#2A0F4F;--halo:rgba(255,90,60,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif;text-align:center;-webkit-tap-highlight-color:transparent}
.glow{position:fixed;inset:auto 0 0 0;height:55vh;background:radial-gradient(ellipse 90% 100% at 50% 110%,var(--halo),transparent 70%);pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:28px 18px 56px}
h1{margin:0;font:400 clamp(56px,21vw,96px)/1 "Bagel Fat One",Nunito,system-ui,sans-serif;letter-spacing:.01em;filter:drop-shadow(0 6px 16px var(--halo))}
h1 span{display:inline-block;transform-origin:50% 100%;background:linear-gradient(180deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:flick 2.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.37s)}
.sub{margin:10px auto 26px;max-width:30ch;color:var(--muted);font-size:17px}
input{display:block;width:100%;padding:16px 18px;border:2px solid var(--edge);border-radius:18px;background:var(--card);color:var(--ink);font:800 19px Nunito,system-ui,sans-serif;text-align:center;outline:0}
input::placeholder{color:var(--muted);font-weight:600}
input:focus{border-color:var(--hot)}
.plus{margin:6px 0;font:800 22px Nunito,sans-serif;color:var(--muted)}
.play{margin-top:16px;width:100%;padding:16px;border:0;border-radius:18px;font:400 23px "Bagel Fat One",Nunito,sans-serif;color:var(--on-grad);background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:0 5px 0 color-mix(in srgb,var(--g2) 55%,#000);cursor:pointer}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--g2) 55%,#000)}
.play:disabled{opacity:.6}
button:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
#msg{min-height:22px;margin:12px 0 0;color:var(--hot);font-weight:800}
#stage{margin-top:22px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.t{position:relative;display:grid;place-items:center;width:28px;height:36px;border-radius:9px;background:var(--tile);font:800 16px Nunito,sans-serif;transition:transform .25s,opacity .25s,background .2s}
.t.hit{background:var(--glow);color:#2A0F4F;animation:pop .45s}
.t.out,.f.out{opacity:.28}
.t.out{transform:scale(.85)}
.t.out::after,.f.out::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:3px;border-radius:2px;background:var(--hot);transform:rotate(-18deg)}
.amp{margin:8px 0;font:800 20px Nunito,sans-serif;color:var(--muted)}
#cap{min-height:24px;margin:20px 0 4px;color:var(--muted);font-weight:800}
#count{min-height:84px;font-weight:800;color:var(--muted)}
#count b{display:block;font:400 64px/1.1 "Bagel Fat One",Nunito,sans-serif;color:var(--hot)}
#count.pop b{animation:pop .55s}
.flames{display:flex;gap:8px;justify-content:center;margin:10px 0 6px;transition:opacity .4s}
.flames.dim{opacity:.35}
.f{position:relative;flex:1;max-width:58px;aspect-ratio:4/5;display:grid;place-items:center;border:2px solid var(--edge);border-radius:14px;background:var(--card);font:400 30px "Bagel Fat One",Nunito,sans-serif;transition:transform .3s,opacity .3s,background .2s}
.f.on{border-color:var(--hot);background:var(--glow);color:#2A0F4F;transform:translateY(-6px) scale(1.12);box-shadow:0 8px 20px var(--halo)}
.f.out{transform:rotate(-8deg) scale(.8)}
.f.win{border-color:transparent;background:linear-gradient(180deg,var(--g1),var(--g2));color:var(--on-grad);transform:scale(1.25);animation:pop .7s}
.n{position:absolute;top:-13px;left:50%;transform:translateX(-50%);min-width:22px;padding:0 6px;border-radius:11px;background:var(--hot);color:#fff;font:800 13px/22px Nunito,sans-serif}
.n:empty{display:none}
#result{margin-top:26px;animation:rise .6s both}
.emo{font-size:64px;line-height:1.1;animation:bob 2s ease-in-out infinite}
.word{font:400 clamp(46px,15vw,72px)/1.1 "Bagel Fat One",Nunito,sans-serif;background:linear-gradient(180deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.who{margin:6px 0 2px;font-weight:800;font-size:19px;overflow-wrap:anywhere}
.note{margin:0 auto 18px;max-width:30ch;color:var(--muted)}
.ghost{padding:12px 26px;border:2px solid var(--edge);border-radius:16px;background:transparent;color:var(--ink);font:800 17px Nunito,sans-serif;cursor:pointer}
.hint,.foot{color:var(--muted);font-size:14px}
.foot{margin-top:36px}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes flick{0%,100%{transform:translateY(0) scaleY(1) skewX(0)}30%{transform:translateY(-4px) scaleY(1.06) skewX(-3deg)}60%{transform:translateY(1px) scaleY(.97) skewX(2deg)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<canvas id="fx"></canvas>
<main>
  <h1 aria-label="FLAMES"><span style="--i:0">F</span><span style="--i:1">L</span><span style="--i:2">A</span><span style="--i:3">M</span><span style="--i:4">E</span><span style="--i:5">S</span></h1>
  <p class="sub">Enter two names and let the fire decide what you are to each other.</p>
  <input id="a" aria-label="First name" placeholder="Your name" maxlength="24" autocomplete="off" autocapitalize="words" enterkeyhint="next">
  <div class="plus">+</div>
  <input id="b" aria-label="Second name" placeholder="Their name" maxlength="24" autocomplete="off" autocapitalize="words" enterkeyhint="go">
  <button id="go" class="play" type="button">Play FLAMES</button>
  <p id="msg" role="status" aria-live="polite"></p>

  <section id="stage" hidden>
    <div id="ra" class="row"></div>
    <div class="amp">&amp;</div>
    <div id="rb" class="row"></div>
    <p id="cap"></p>
    <div id="count"></div>
    <div id="flames" class="flames dim"></div>
    <p id="hint" class="hint">Tap anywhere to speed up</p>
    <div id="result" hidden></div>
  </section>
  <p class="foot">Just for fun. The fire has never been right about anything.</p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyClYIN-WIfVu1pQVRpiDWpsbvDYz7QvBnA",authDomain:"flames-unfav.firebaseapp.com",projectId:"flames-unfav",storageBucket:"flames-unfav.firebasestorage.app",messagingSenderId:"625847407648",appId:"1:625847407648:web:aa0977999e4b580fe6d845"};
let db=null;
try{if(!firebaseConfig.apiKey.startsWith("PASTE"))db=getFirestore(initializeApp(firebaseConfig))}catch(e){console.warn(e)}
/* Saves one document per game in the "plays" collection */
window.saveNames=async(name1,name2,result)=>{
  if(!db)return;
  try{await addDoc(collection(db,"plays"),{name1,name2,result,createdAt:serverTimestamp()})}
  catch(e){console.warn("Save failed",e)}
};
</script>
<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R={F:['Friends','🤝','Easy laughs, zero drama, and a bond that lasts.'],L:['Love','💘','Sparks everywhere. The fire definitely ships it.'],A:['Affection','🥰','A warm, caring bond. You really look out for each other.'],M:['Marriage','💍','Whoa. The flames see a long future together.'],E:['Enemies','⚔️','Fiery clashes ahead. Try not to start a prank war.'],S:['Siblings','🫶','Like family: you’ll bicker, and still have each other’s back.']};
let fast=false,busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,fast?15:ms));
const letters=s=>[...s].filter(c=>/\p{L}/u.test(c));
const mk=(cls,txt)=>{const e=document.createElement('span');e.className=cls;e.textContent=txt;return e};
const mid=e=>{const r=e.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};
const look=(e,b)=>e.scrollIntoView({behavior:RM?'auto':'smooth',block:b});

/* ember + confetti particles */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,P=[],raf=0;
const fit=()=>{const r=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0)};
fit();addEventListener('resize',fit);
function burst(x,y,n=18,cols=['#FF3D81','#FF9F1C','#FFD23F','#3EE6C3'],power=1){
  if(RM)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*5)*power;
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,r:2+Math.random()*4,c:cols[i%cols.length]})}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,W,H);P=P.filter(p=>p.l>0);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.985;p.l-=.014;
    cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
  raf=P.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,W,H);
}

async function play(){
  if(busy)return;
  const a=letters($('#a').value),b=letters($('#b').value),msg=$('#msg');
  const bad=[['#a',a],['#b',b]].filter(x=>!x[1].length);
  if(bad.length){
    msg.textContent='Enter both names to play.';
    bad.forEach(([s])=>{const e=$(s);e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')});
    return;
  }
  msg.textContent='';busy=true;fast=false;$('#go').disabled=true;
  const names=[$('#a').value.trim(),$('#b').value.trim()];
  const ra=$('#ra'),rb=$('#rb'),fl=$('#flames'),cap=$('#cap'),cnt=$('#count'),res=$('#result'),st=$('#stage'),hint=$('#hint');
  ra.replaceChildren(...a.map(c=>mk('t',c.toUpperCase())));
  rb.replaceChildren(...b.map(c=>mk('t',c.toUpperCase())));
  fl.replaceChildren(...[...'FLAMES'].map(c=>{const t=mk('f',c);t.append(mk('n',''));return t}));
  fl.className='flames dim';cnt.textContent='';cnt.className='';res.hidden=true;res.replaceChildren();
  hint.hidden=false;cap.textContent='Crossing out the letters you share…';
  st.hidden=false;look(st,'start');

  const ta=[...ra.children],tb=[...rb.children];
  await sleep(700);
  const used=new Set(),pairs=[];
  a.forEach((c,i)=>{const j=b.findIndex((d,k)=>!used.has(k)&&d.toLowerCase()===c.toLowerCase());if(j>-1){used.add(j);pairs.push([i,j])}});
  const d=Math.max(90,Math.min(360,2400/Math.max(pairs.length,1)));
  for(const [i,j] of pairs){
    ta[i].classList.add('hit');tb[j].classList.add('hit');
    burst(...mid(ta[i]),8);burst(...mid(tb[j]),8);
    await sleep(d);
    ta[i].className='t out';tb[j].className='t out';
    await sleep(d/2);
  }

  const left=a.length+b.length-2*pairs.length;
  if(!left){
    cap.textContent='Every letter cancelled out. Try two different names.';
    window.saveNames&&saveNames(names[0],names[1],'none');
    hint.hidden=true;busy=false;$('#go').disabled=false;return;
  }
  await sleep(400);
  cnt.innerHTML=`<b>${left}</b>letter${left>1?'s':''} left`;
  cnt.classList.add('pop');
  cap.textContent=`Now count ${left} at a time around FLAMES.`;
  await sleep(900);
  fl.classList.remove('dim');look(fl,'center');
  await sleep(500);

  const tiles=[...fl.children];let alive=[0,1,2,3,4,5],p=0;
  const dl=Math.max(55,Math.min(300,5000/(left*5)));
  while(alive.length>1){
    let t;
    for(let k=0;k<left;k++){
      t=tiles[alive[(p+k)%alive.length]];
      t.classList.add('on');t.lastChild.textContent=k+1;
      await sleep(dl);
      if(k<left-1){t.classList.remove('on');t.lastChild.textContent=''}
    }
    const idx=(p+left-1)%alive.length;
    t.classList.remove('on');t.lastChild.textContent='';t.classList.add('out');
    burst(...mid(t),22);
    await sleep(520);
    alive.splice(idx,1);p=idx%alive.length;
  }

  const key='FLAMES'[alive[0]],[word,emo,note]=R[key];
  tiles[alive[0]].classList.add('win');
  window.saveNames&&saveNames(names[0],names[1],word);
  cap.textContent='The fire has spoken.';hint.hidden=true;
  await sleep(700);
  res.innerHTML=`<div class="emo">${emo}</div><div class="word">${word}</div><p class="who"></p><p class="note">${note}</p><button id="again" class="ghost" type="button">Play again</button>`;
  res.querySelector('.who').textContent=names.join('  +  ');
  res.hidden=false;look(res,'center');
  for(let i=0;i<7;i++)setTimeout(()=>burst(W*(.15+Math.random()*.7),H*(.2+Math.random()*.3),40,undefined,1.5),i*160);
  $('#again').onclick=()=>{st.hidden=true;scrollTo({top:0,behavior:RM?'auto':'smooth'});$('#a').select()};
  busy=false;$('#go').disabled=false;
}

$('#go').onclick=play;
$('#a').addEventListener('keydown',e=>{if(e.key==='Enter')$('#b').focus()});
$('#b').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.blur();play()}});
$('#stage').addEventListener('click',()=>{if(busy)fast=true});
</script>
</body>
</html>
