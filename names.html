<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FLAMES names</title>
<style>
:root{--bg:#F6EEFF;--ink:#2A0F4F;--muted:#6B5A8A;--card:#fff;--edge:#CDB6F5;--hot:#D81B6A;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#1C0A38;--ink:#FFF1F7;--muted:#B9A5DB;--card:#2B1352;--edge:#5A3496;--hot:#FF4D94}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 56px}
h1{margin:0 0 18px;font-size:28px}
button{padding:12px 20px;border:0;border-radius:14px;background:var(--hot);color:#fff;font:800 16px inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--edge);padding:8px 14px}
button:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
#msg{color:var(--muted);margin:14px 0}
#bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{padding:14px 16px;border:2px solid var(--edge);border-radius:16px;background:var(--card)}
li b{display:block;font-size:20px;overflow-wrap:anywhere}
li span{display:inline-block;margin-top:4px;margin-right:12px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Names played</h1>
  <p id="msg" role="status"></p>
  <div id="bar"><span id="count"></span></div>
  <ul id="list"></ul>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,query,orderBy,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyClYIN-WIfVu1pQVRpiDWpsbvDYz7QvBnA",authDomain:"flames-unfav.firebaseapp.com",projectId:"flames-unfav",storageBucket:"flames-unfav.firebasestorage.app",messagingSenderId:"625847407648",appId:"1:625847407648:web:aa0977999e4b580fe6d845"});
const db=getFirestore(app),list=document.getElementById('list');
const say=t=>document.getElementById('msg').textContent=t;
say('Loading…');
onSnapshot(query(collection(db,'plays'),orderBy('createdAt','desc'),limit(500)),snap=>{
  document.getElementById('count').textContent=snap.size+(snap.size===1?' game':' games')+' (newest first)';
  say(snap.size?'':'No games played yet.');
  list.replaceChildren(...snap.docs.map(d=>{
    const x=d.data(),li=document.createElement('li'),n=document.createElement('b');
    n.textContent=x.name1+' & '+x.name2;
    const r=document.createElement('span');r.textContent=x.result==='none'?'Same letters':x.result;
    const t=document.createElement('span');t.textContent=x.createdAt?x.createdAt.toDate().toLocaleString():'Just now';
    li.append(n,r,t);
    return li;
  }));
},err=>say('Could not load names ('+err.code+'). Check your Firestore rules.'));
</script>
</body>
</html>
